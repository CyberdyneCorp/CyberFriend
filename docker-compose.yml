# Coolify `dockercompose` build pack.
#
# Four services share one image:
#   ingest - Discord gateway client plus background workers. No domain.
#   bot    - answers questions in Discord. No domain.
#   mcp    - HTTP retrieval interface. Published.
#   admin  - the operator console: API plus its static interface. Published,
#            on its own domain, and holding database credentials ONLY.
#
# The database is NOT defined here: production uses a Coolify-managed
# "PostgreSQL with pgvector" resource so that scheduled backups apply.
services:
  # Runs once per deploy and exits. Everything else waits on it, so the
  # schema exists before anything queries it. Only this service migrates:
  # four long-running containers racing the same DDL on every deploy is a
  # real race, not a theoretical one -- alembic takes no lock of its own.
  migrate:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.migrate"]
    restart: "no"
    environment:
      # Only the database. A migration needs no Discord token and no model
      # key; passing them would let their absence fail the deploy.
      - DATABASE_URL=${DATABASE_URL}

  ingest:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.ingest"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Exactly one. Two containers sharing a bot token both identify to the
    # Discord gateway and ingest every message twice. Discord does not error;
    # the corpus silently doubles.
    deploy:
      replicas: 1
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - INDEXED_CHANNEL_IDS=${INDEXED_CHANNEL_IDS}
      - DATABASE_URL=${DATABASE_URL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - EXTRACTION_MODEL=${EXTRACTION_MODEL}
      - ASK_EXTRACTION_ENABLED=${ASK_EXTRACTION_ENABLED}
      - ASK_MIN_CONFIDENCE=${ASK_MIN_CONFIDENCE}
      - ASK_STALE_AFTER_DAYS=${ASK_STALE_AFTER_DAYS}
      - ASK_EXTRACTION_WINDOW_MESSAGES=${ASK_EXTRACTION_WINDOW_MESSAGES}
      - WINDOW_MAX_MESSAGES=${WINDOW_MAX_MESSAGES}
      - WINDOW_MAX_TOKENS=${WINDOW_MAX_TOKENS}
      - WINDOW_GAP_SECONDS=${WINDOW_GAP_SECONDS}
      # How long what people asked the assistant is kept. This process runs
      # the sweep that deletes it; the bot only reads and writes it.
      - MEMORY_RETENTION_DAYS=${MEMORY_RETENTION_DAYS}
      - HEALTH_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/ready', timeout=5).status==200 else 1)\""]
      # /ready, not /health: liveness is deliberately dependency-free, so a
      # process that serves HTTP while failing to reach Discord reported 200
      # for as long as it stayed up -- which is precisely how a crash-looping
      # bot went an hour looking healthy. Readiness reflects the gateway.
      #
      # Five retries over a 90s grace tolerates a reconnect without thrashing,
      # and still marks a service that never connects as unhealthy in ~4
      # minutes rather than never.
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  bot:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.bot"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # One replica. A second would answer every question twice.
    deploy:
      replicas: 1
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - INDEXED_CHANNEL_IDS=${INDEXED_CHANNEL_IDS}
      - DATABASE_URL=${DATABASE_URL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - CHAT_MODEL=${CHAT_MODEL}
      - EXTRACTION_MODEL=${EXTRACTION_MODEL}
      - CHAT_MODEL_CAPABILITIES=${CHAT_MODEL_CAPABILITIES}
      - FEDERATION_SERVERS=${FEDERATION_SERVERS}
      - FEDERATION_TOOL_ALLOWLIST=${FEDERATION_TOOL_ALLOWLIST}
      # Who may spend a `:enable-mutation` tool, as server=platform:user_id.
      # Without it an enabled mutating tool is refused at startup: the two
      # halves of a grant to change something are declared separately on
      # purpose, and half a grant is a configuration error, not a default.
      - FEDERATION_CREDENTIAL_HOLDERS=${FEDERATION_CREDENTIAL_HOLDERS}
      - FEDERATION_MAX_TOOLS_PER_RUN=${FEDERATION_MAX_TOOLS_PER_RUN}
      - WEB_TOOLS_ENABLED=${WEB_TOOLS_ENABLED}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - WEB_MAX_CALLS_PER_RUN=${WEB_MAX_CALLS_PER_RUN}
      - WEB_TIMEOUT_SECONDS=${WEB_TIMEOUT_SECONDS}
      # Conversation memory: turns kept verbatim, and the size past which older
      # turns are summarised on EXTRACTION_MODEL in the background.
      - MEMORY_RECENT_TURNS=${MEMORY_RECENT_TURNS}
      - MEMORY_SUMMARISE_AFTER_TURNS=${MEMORY_SUMMARISE_AFTER_TURNS}
      - HEALTH_PORT=8082
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/ready', timeout=5).status==200 else 1)\""]
      # /ready, not /health: liveness is deliberately dependency-free, so a
      # process that serves HTTP while failing to reach Discord reported 200
      # for as long as it stayed up -- which is precisely how a crash-looping
      # bot went an hour looking healthy. Readiness reflects the gateway.
      #
      # Five retries over a 90s grace tolerates a reconnect without thrashing,
      # and still marks a service that never connects as unhealthy in ~4
      # minutes rather than never.
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  mcp:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.mcp_server"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - CHAT_MODEL=${CHAT_MODEL}
      - MCP_PORT=8081
      - SERVICE_FQDN_MCP_8081
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/ready', timeout=5).status==200 else 1)\""]
      # Same tolerance as the other gateway holders: readiness dips during a
      # normal reconnect, and restarting on the first dip turns a Discord
      # blip into a restart loop.
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # The operator console. Note what is absent from its environment: no
  # DISCORD_TOKEN, no LLM_API_KEY, no SERPAPI_KEY, no platform credential of
  # any kind. It changes configuration in the database, which is why stored
  # configuration exists at all -- a console that could redeploy would need
  # platform access, which is far more authority than the job requires, and a
  # console holding the bot token could impersonate the bot everywhere it is
  # installed.
  #
  # The editable settings ARE passed, although this service never acts on
  # them. They are its environment baseline: the console shows whether a value
  # came from the database, the environment or a default, and a container that
  # cannot see the environment would report every unedited setting as
  # "default" on the one screen built to explain where values come from.
  # Coolify also only accepts variables a compose file declares, so a setting
  # missing here is one an operator sets and silently does not get.
  admin:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.admin"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # One replica. Nothing breaks with two -- it holds no gateway connection
    # and no queue -- but two operators editing one list through two replicas
    # is a read-modify-write race on a setting, and the losing edit is silent.
    deploy:
      replicas: 1
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - INDEXED_CHANNEL_IDS=${INDEXED_CHANNEL_IDS}
      - FEDERATION_SERVERS=${FEDERATION_SERVERS}
      - FEDERATION_TOOL_ALLOWLIST=${FEDERATION_TOOL_ALLOWLIST}
      - FEDERATION_CREDENTIAL_HOLDERS=${FEDERATION_CREDENTIAL_HOLDERS}
      - FEDERATION_MAX_TOOLS_PER_RUN=${FEDERATION_MAX_TOOLS_PER_RUN}
      - WEB_TOOLS_ENABLED=${WEB_TOOLS_ENABLED}
      - WEB_MAX_CALLS_PER_RUN=${WEB_MAX_CALLS_PER_RUN}
      - WEB_TIMEOUT_SECONDS=${WEB_TIMEOUT_SECONDS}
      - ASK_EXTRACTION_ENABLED=${ASK_EXTRACTION_ENABLED}
      - ASK_MIN_CONFIDENCE=${ASK_MIN_CONFIDENCE}
      - ASK_STALE_AFTER_DAYS=${ASK_STALE_AFTER_DAYS}
      - ASK_EXTRACTION_WINDOW_MESSAGES=${ASK_EXTRACTION_WINDOW_MESSAGES}
      - WINDOW_MAX_MESSAGES=${WINDOW_MAX_MESSAGES}
      - WINDOW_MAX_TOKENS=${WINDOW_MAX_TOKENS}
      - WINDOW_GAP_SECONDS=${WINDOW_GAP_SECONDS}
      - ADMIN_PORT=8083
      # Where the image puts the built interface. Absent, the API still serves
      # and the root page says the bundle is missing -- a deploy that forgot to
      # build it reads as that rather than as a broken API.
      - ADMIN_CONSOLE_DIR=/app/console
      # Its own domain. Separate from the MCP one so the console can be closed
      # to the internet without taking retrieval with it.
      - SERVICE_FQDN_ADMIN_8083
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8083/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
