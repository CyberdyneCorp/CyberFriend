# Coolify `dockercompose` build pack.
#
# Two services share one image:
#   ingest - Discord gateway client plus background workers. No domain.
#   mcp    - HTTP retrieval interface. The only service given an FQDN.
#
# The database is NOT defined here: production uses a Coolify-managed
# "PostgreSQL with pgvector" resource so that scheduled backups apply.
services:
  ingest:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.ingest"]
    restart: unless-stopped
    # Exactly one. Two containers sharing a bot token both identify to the
    # Discord gateway and ingest every message twice. Discord does not error;
    # the corpus silently doubles.
    deploy:
      replicas: 1
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - INDEXED_CHANNEL_IDS=${INDEXED_CHANNEL_IDS}
      - DATABASE_URL=${DATABASE_URL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - EXTRACTION_MODEL=${EXTRACTION_MODEL}
      - WINDOW_MAX_MESSAGES=${WINDOW_MAX_MESSAGES}
      - WINDOW_MAX_TOKENS=${WINDOW_MAX_TOKENS}
      - WINDOW_GAP_SECONDS=${WINDOW_GAP_SECONDS}
      - HEALTH_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bot:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.bot"]
    restart: unless-stopped
    # One replica. A second would answer every question twice.
    deploy:
      replicas: 1
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - INDEXED_CHANNEL_IDS=${INDEXED_CHANNEL_IDS}
      - DATABASE_URL=${DATABASE_URL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - CHAT_MODEL=${CHAT_MODEL}
      - EXTRACTION_MODEL=${EXTRACTION_MODEL}
      - CHAT_MODEL_CAPABILITIES=${CHAT_MODEL_CAPABILITIES}
      - HEALTH_PORT=8082
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp:
    build: .
    command: ["python", "-m", "chatmemory.entrypoints.mcp_server"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - CHAT_MODEL=${CHAT_MODEL}
      - MCP_PORT=8081
      - SERVICE_FQDN_MCP_8081
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
