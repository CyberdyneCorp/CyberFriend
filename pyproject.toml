[project]
name = "chatmemory"
version = "0.1.0"
description = "CyberFriend - ACL-aware chat memory and retrieval for Discord"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "openai>=1.40",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "tiktoken>=0.7",
    # Document ingestion (add-document-ingestion). Declared centrally so
    # parallel work never contends on this file.
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "charset-normalizer>=3.3",
    # Keccak-256 for Uniswap v4 pool IDs (add-defi-positions). Hashing only:
    # nothing in this project signs.
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.7",
    # Pinned for the end-to-end harness, which drives discord.py through a
    # few private names (tests/e2e/test_harness_canary.py lists them). The
    # runtime dependency above stays open; an upgrade moves both together.
    "discord-py~=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmemory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The core must not know which platform it is serving. Platform SDKs belong
# in adapters/ and entrypoints/ only, which are exempted below.
"discord".msg = "only adapters/ may import a platform SDK; keep domain, ports and app platform-agnostic"

[tool.ruff.lint.per-file-ignores]
"src/chatmemory/adapters/discord/*" = ["TID251"]
"src/chatmemory/entrypoints/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["chatmemory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # The retrieval golden set. Opted into rather than run by default: it
    # seeds a corpus and asks every question as every viewer against the real
    # embedding endpoint, so an ordinary `pytest` must not spend that money.
    # See tests/evaluation/BASELINE.md.
    "goldens: retrieval quality measurement; costs embedding calls",
]
