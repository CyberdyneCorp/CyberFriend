[project]
name = "chatmemory"
version = "0.1.0"
description = "CyberFriend - ACL-aware chat memory and retrieval for Discord"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "openai>=1.40",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmemory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The core must not know which platform it is serving. See design.md.
"discord".msg = "domain/ and ports/ must not import platform adapters"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["chatmemory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
