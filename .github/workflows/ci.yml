name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # The integration suite is where the permission predicate is proved against
    # a real planner and a real approximate index. A job without a database
    # skips exactly those tests and stays green, which is the failure mode this
    # service container exists to remove. pgvector, not stock postgres: the
    # schema creates a `vector` column in its first migration.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chatmemory
          POSTGRES_PASSWORD: chatmemory
          POSTGRES_DB: chatmemory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatmemory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Settings has no defaults for these and is imported by the migrations,
      # so they must exist for anything to load. They are placeholders: no test
      # may reach a real service with them.
      DISCORD_TOKEN: ci
      DISCORD_GUILD_ID: "1"
      LLM_API_KEY: ci
      DATABASE_URL: postgresql+asyncpg://chatmemory:chatmemory@localhost:5432/chatmemory
      TEST_DATABASE_URL: postgresql+asyncpg://chatmemory:chatmemory@localhost:5432/chatmemory
      # The live-endpoint tests skip without a key and CI deliberately supplies
      # none: a pull request from a fork must not be able to spend money, and
      # the fixture's default key path is a developer's machine.
      OPENAI_KEY_FILE: /nonexistent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.8.0

      # First, because it is the cheapest check and because the specs are meant
      # to be changed before the code is.
      - name: openspec validate
        run: openspec validate --all --strict

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy
        run: mypy

      # Unit tests need no database, and run before one is touched: a broken
      # service container must not be able to hide a failing unit suite.
      - name: pytest (unit)
        run: pytest tests/unit -q

      - name: Migrate
        run: alembic upgrade head

      - name: pytest (all)
        run: pytest tests -q --ignore=tests/e2e

      # The production bot process over fakes at its edges, against the
      # migrated database above. E2E_REQUIRE_DB turns the suite's skip for a
      # missing database into a failure: a green run here means it ran.
      - name: pytest (e2e)
        env:
          E2E_REQUIRE_DB: "1"
        run: pytest tests/e2e -q --durations=10
